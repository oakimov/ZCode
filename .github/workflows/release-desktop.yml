name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v3.18.2-fork.1). Leave empty to use the triggering ref name."
        required: false
        type: string
      os:
        description: "Target OS for a single-platform build"
        required: false
        default: "mac"
        type: choice
        options:
          - mac
          - win
          - linux
          - all

permissions:
  contents: write

env:
  # 本公开 fork：遥测 / ARMS / OTEL / 自动更新永久硬关闭；CI 显式清空，避免 runner 环境泄漏。
  ZCODE_ARMS_RUM_ENDPOINT: ""
  ZCODE_TELEMETRY_REPORT_ENDPOINT: ""
  ZCODE_AUTO_UPDATE: ""
  ZCODE_PACKAGED_AGENT_OTEL_ENDPOINT: ""
  ZCODE_PACKAGED_AGENT_OTEL_HEADERS: ""
  ZCODE_PACKAGED_AGENT_OTEL_SERVICE_NAME: ""
  ZCODE_MODEL_TELEMETRY_ENABLED: "0"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_HEADERS: ""
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ZCODE_ENABLE_MAC_SIGN: "0"
  HUSKY: "0"

jobs:
  guard-telemetry:
    name: Telemetry hard-disabled guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Assert telemetry stays hard-disabled
        run: node scripts/assert-telemetry-hard-disabled.mjs

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: guard-telemetry
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac-arm64
            runner: macos-14
            os: mac
            arch: arm64
            artifact_glob: packages/desktop/dist/*.{dmg,zip,yml,yaml,json,blockmap}
          - label: win-x64
            runner: windows-latest
            os: win
            arch: x64
            artifact_glob: packages/desktop/dist/*.{exe,yml,yaml,json,blockmap}
          - label: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x64
            artifact_glob: packages/desktop/dist/*.{AppImage,deb,rpm,yml,yaml,json}
    steps:
      - name: Decide whether this matrix cell runs
        id: gate
        shell: bash
        run: |
          requested="${{ github.event_name == 'workflow_dispatch' && inputs.os || 'all' }}"
          if [[ "$requested" == "all" || "$requested" == "${{ matrix.os }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Assert telemetry stays hard-disabled
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: node scripts/assert-telemetry-hard-disabled.mjs

      - name: Bootstrap workspace
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: pnpm bootstrap

      - name: Bundle desktop installer
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Re-assert telemetry stayed hard-disabled after build
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: node scripts/assert-telemetry-hard-disabled.mjs

      - name: Upload build artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find release-assets -type f | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ZCode Desktop ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
